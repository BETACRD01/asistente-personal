<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgentRelay — Terminal remoto</title>
  <link rel="stylesheet" href="../node_modules/xterm/css/xterm.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header id="topbar">
    <span class="logo">◉ AgentRelay</span>
    <span id="status" class="pill">desconectado</span>
  </header>

  <section id="panels">
    <div class="panel">
      <h3 class="ptitle">Esta máquina</h3>
      <div class="vrow">
        <label>Código de esta máquina</label>
        <div class="codebox">
          <code id="mycode">—</code>
          <button id="copycode" title="Copiar código">copiar</button>
        </div>
      </div>
      <div class="vrow">
        <label>Device token</label>
        <input id="device" placeholder="tu DEVICE_TOKEN" spellcheck="false" />
      </div>
      <div class="vrow">
        <label>Puerto SSH local</label>
        <input id="sshport" placeholder="22" spellcheck="false" />
      </div>
      <div class="vrow">
        <label class="chk"><input type="checkbox" id="serve" /> Servir esta máquina</label>
        <span id="srvstatus" class="mini">parado</span>
      </div>
    </div>

    <div class="panel">
      <h3 class="ptitle">Conectar</h3>
      <div class="vrow">
        <label>Hub</label>
        <input id="hub" placeholder="https://agentrelay.duckdns.org" spellcheck="false" />
      </div>
      <div class="vrow">
        <label>Máquinas registradas</label>
        <div class="hrow">
          <button id="scan">Buscar máquinas</button>
          <select id="devices">
            <option value="">(elegir máquina)</option>
          </select>
        </div>
      </div>
      <div class="vrow">
        <label>Conectar con código de otra máquina</label>
        <div class="hrow">
          <input id="codeconnect" placeholder="código" spellcheck="false" />
          <button id="codeconnectbtn">Conectar</button>
        </div>
      </div>
      <div class="hrow">
        <button id="connect" class="primary">Conectar</button>
        <button id="reconnect" title="Reconectar">↻</button>
      </div>
    </div>
  </section>

  <div id="terminal"></div>

  <div id="reqmodal" class="hidden">
    <div class="reqbox">
      <p class="reqtitle">¿Permitir conexión?</p>
      <p class="reqinfo">La máquina <b id="reqfrom">—</b> quiere acceder a esta máquina.</p>
      <button id="reqok">Permitir</button>
      <button id="reqno">Rechazar</button>
    </div>
  </div>

  <script src="../node_modules/xterm/lib/xterm.js"></script>
  <script src="../node_modules/@xterm/addon-fit/lib/addon-fit.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
